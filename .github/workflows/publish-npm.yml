name: Publish npm package

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to publish, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: "npm-publish-${{ github.repository }}-${{ inputs.tag || github.ref_name }}"
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify tag matches package version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release ref must be a vX.Y.Z tag: $RELEASE_TAG" >&2
            exit 1
          fi
          tag_version="${RELEASE_TAG#v}"
          package_version="$(node -e "const fs = require('node:fs'); console.log(JSON.parse(fs.readFileSync('package.json', 'utf8')).version)")"
          test "$tag_version" = "$package_version"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check publish contents
        run: npm pack --dry-run

      - name: Use npm with Trusted Publishing support
        run: npm install --global npm@11.5.1

      - name: Publish with npm provenance
        run: npm publish --access public --provenance
